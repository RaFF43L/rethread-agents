services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rethread-pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rethread
    ports:
      # Host 5434 -> container 5432 (não conflita com o agent-task-triage em 5433).
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Habilita a extensao vector automaticamente na 1a inicializacao do banco.
      - ./script/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rethread"]
      interval: 5s
      timeout: 3s
      retries: 10

  # API FastAPI em http://localhost:8000 (Swagger em /docs).
  # Código montado do host + --reload: editar o src/ reinicia a API sozinho.
  api:
    image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    container_name: rethread-api
    working_dir: /app
    env_file: .env
    environment:
      # Dentro da rede do compose o Postgres é `postgres:5432`, não localhost:5434.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/rethread
      PYTHONPATH: /app/src
      UV_PROJECT_ENVIRONMENT: /venv
      UV_LINK_MODE: copy
    command: >-
      sh -c "uv sync --frozen &&
             uv run --no-sync uvicorn api:app --host 0.0.0.0 --port 8000 --reload --reload-dir src"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      # venv e cache do uv fora do diretório montado (não sujam o projeto no Windows).
      - venv:/venv
      - uvcache:/root/.cache/uv
    depends_on:
      postgres:
        condition: service_healthy

  # Servidor LiveKit (WebRTC) em modo dev: credenciais fixas devkey / secret.
  # --node-ip 127.0.0.1: o navegador do host conecta a mídia pelas portas publicadas.
  livekit:
    image: livekit/livekit-server:v1.13
    container_name: rethread-livekit
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1
    ports:
      - "7880:7880"       # sinalização (ws://localhost:7880)
      - "7881:7881"       # WebRTC via TCP
      - "7882:7882/udp"   # WebRTC via UDP

  # Agente de voz (LiveKit Agents): entra em toda sala nova e responde com o
  # pipeline da `api` (channel=voice). Compartilha a rede do `livekit` porque o
  # servidor anuncia 127.0.0.1 como endereço de mídia.
  # Em produção o voice roda no mesmo container da API (Dockerfile → docker-entrypoint.sh);
  # aqui usa só o estágio `voice` da imagem, para a API seguir com --reload.
  voice:
    build:
      context: .
      target: voice
    container_name: rethread-voice
    env_file: .env
    environment:
      # LiveKit Cloud quando LIVEKIT_* estão no .env; senão, o servidor `livekit` local.
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://127.0.0.1:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      RETHREAD_API_URL: http://api:8000
    volumes:
      # Ferramentas locais de teste (fora do git): dev/make_token.py, dev/playground.html
      - ./voice/dev:/app/voice/dev:ro
    network_mode: "service:livekit"
    depends_on:
      - livekit
      - api

volumes:
  pgdata:
  venv:
  uvcache:
